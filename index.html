<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mixbox Palette</title>
    <style>
        body { 
            margin: 0; 
            background: #2b2b2b; 
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .loader-container {
            width: 80%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .loading-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .progress-container {
            width: 100%;
            height: 4px;
            background: #404040;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a9eff, #7b68ee);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .status-text {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
            min-height: 20px;
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 16px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .retry-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: none;
        }
        
        .retry-btn.show {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loading-icon">🎨</div>
        <h1>Mixbox Palette</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText"></div>
        <div class="error-message" id="errorMessage"></div>
        <button class="retry-btn" id="retryBtn"></button>
    </div>

<script>
// 简单语言检测（跟随系统，中文系统用中文，其他用英文）
const _isZh = (navigator.language || '').toLowerCase().startsWith('zh');
const T = {
    detecting:     _isZh ? '检测最快的服务器...'         : 'Detecting fastest server...',
    launching:     _isZh ? '启动应用...'                  : 'Launching app...',
    fallback:      _isZh ? '无法连接到服务器，使用默认源' : 'Cannot reach server, using default source',
    errorLoad:     _isZh ? '加载失败，请检查网络连接。'   : 'Load failed. Please check your network connection.',
    errorConnect:  _isZh ? '无法连接到服务器，请检查网络连接后重试。'     : 'Cannot connect to server. Please check your network and retry.',
    retrying:      _isZh ? '重新连接...'                  : 'Reconnecting...',
    retry:         _isZh ? '重试'                         : 'Retry',
};

document.getElementById('statusText').textContent  = T.detecting;
document.getElementById('errorMessage').textContent = T.errorLoad;
document.getElementById('retryBtn').textContent     = T.retry;

const SOURCES = [
    "https://mixbox-palette.pages.dev/",
    "https://food211.github.io/Mixbox-Palette/"
];

const PROBE_FILE = "js/updater.js";
const TIMEOUT_MS = 4000;

// 更新进度条
function updateProgress(percent, message) {
    document.getElementById('progressBar').style.width = `${percent}%`;
    if (message) {
        document.getElementById('statusText').textContent = message;
    }
}

// 显示错误信息
function showError(message) {
    document.getElementById('errorMessage').textContent = message;
    document.getElementById('errorMessage').classList.add('show');
    document.getElementById('retryBtn').classList.add('show');
}


async function race() {
    // 透传 URL 参数（如 ?host=1.0.4）到 app.html
    const params = new URLSearchParams(window.location.search);
    const suffix = params.toString() ? '?' + params.toString() : '';

    const controller = new AbortController();
    let timeout;
    try {
        updateProgress(0, T.detecting);
        const deadline = new Promise((_, reject) => {
            timeout = setTimeout(() => {
                controller.abort();
                reject(new Error('Source detection timed out'));
            }, TIMEOUT_MS);
        });
        const probes = Promise.any(
            SOURCES.map((base, i) =>
                fetch(base + PROBE_FILE, { cache: 'no-store', signal: controller.signal })
                    .then(r => {
                        if (!r.ok) throw new Error(r.status);
                        return i;
                    })
            )
        );
        const fastest = await Promise.race([probes, deadline]);
        const baseUrl = SOURCES[fastest];
        // 下载由 app.html / SW 负责。no-store 预下载无法复用，只会多下载一整套文件。
        updateProgress(100, T.launching);
        window.location.replace(baseUrl + "app.html" + suffix);
    } catch (e) {
        console.error("服务器检测失败:", e);
        updateProgress(5, T.fallback);
        
        // 离线时探测可能失败，但当前源已有完整 SW 快照；直接导航仍可由 SW 恢复。
        const currentSource = SOURCES.find(base => new URL(base).origin === location.origin);
        if (currentSource) {
            window.location.replace(currentSource + "app.html" + suffix);
        } else {
            showError(T.errorConnect);
        }
    } finally {
        clearTimeout(timeout);
        controller.abort(); // 取消败者和未消费的探测响应，成功路径也不遗留请求。
    }
}

// 初始化
race();

// 重试按钮事件监听
document.getElementById('retryBtn').addEventListener('click', () => {
    document.getElementById('errorMessage').classList.remove('show');
    document.getElementById('retryBtn').classList.remove('show');
    updateProgress(0, T.retrying);
    race();
});
</script>
</body>
</html>
