<script>
    const markStartup = (stage) => performance.mark('palette:' + stage);
    markStartup('start');
    const loadIsZh = (navigator.language || '').toLowerCase().startsWith('zh');
    const retryButton = document.getElementById('appLoadRetry');
    retryButton.textContent = loadIsZh ? '重试' : 'Retry';
    retryButton.addEventListener('click', () => location.reload());
    function showLoadProblem(failed) {
        const status = document.getElementById('appLoadStatus');
        if (!status) return; // 宿主版本不兼容时由 app.js 展示专用页面。
        status.textContent = failed
            ? (loadIsZh ? '加载失败，请检查网络连接后重试。' : 'Loading failed. Check your connection and retry.')
            : (loadIsZh ? '加载时间较长，正在继续尝试。您也可以重试。' : 'Loading is taking longer. Still trying; you can also retry.');
        retryButton.hidden = false;
    }
    // 超时只提供恢复操作，绝不把尚未初始化的 UI 宣告为可用。
    const loadingWatchdog = setTimeout(() => showLoadProblem(false), 15000);

    // 创建script标签加载适当的库（同一 src 只加载一次，返回同一 Promise）
    const _loadScriptCache = new Map();
    function loadScript(src) {
        if (_loadScriptCache.has(src)) return _loadScriptCache.get(src);
        const p = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => resolve();
            script.onerror = () => {
                _loadScriptCache.delete(src); // 失败允许重试
                console.error(`Failed to load script: ${src}`);
                reject(new Error(`Failed to load script: ${src}`));
            };
            document.head.appendChild(script);
        });
        _loadScriptCache.set(src, p);
        return p;
    }

    // 供 app.js 在切换到 KM 或启动时按需加载 KM 引擎
    // LUT 数据由 km-painter.js 内部 fetch('assets/km-lut.png') 加载
    window.ensureKMLoaded = async function() {
        await loadScript('js/km-painter.js');
    };

    // 供 app.js 在切换到 MB 或启动时按需加载 Mixbox 引擎
    window.ensureMBLoaded = async function() {
        await loadScript('js/mixbox.js');
        await loadScript('js/mixbox-painter.js');
    };

    // 先下载、后按原有依赖层执行，避免 app.js 等大文件等到最后一层才开始下载。
    function preloadResource(href, as) {
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = as;
        link.href = href;
        if (as === 'fetch') link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
    }

    async function prepareServiceWorker() {
        if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
        const sw = navigator.serviceWorker;
        // 更新检查仍执行；已有控制器时资源直接读完整旧快照，安装新版不阻塞启动。
        const registration = Promise.resolve().then(() => sw.register('./sw.js'));
        registration.catch(error => console.warn('Service Worker 注册失败:', error));
        if (sw.controller) return;
        let timeout, onController, installing, onState;
        try {
            // ready 不保证页面已被 claim。等 controllerchange，离线冷启动才不会抢跑网络。
            await new Promise((resolve) => {
                onController = () => { if (sw.controller) resolve(); };
                sw.addEventListener('controllerchange', onController);
                timeout = setTimeout(resolve, 3000);
                registration.then(reg => {
                    installing = reg.installing;
                    if (installing) {
                        onState = () => { if (installing.state === 'redundant') resolve(); };
                        installing.addEventListener('statechange', onState);
                        onState();
                    }
                    onController();
                }, resolve);
                onController();
            });
        } finally {
            clearTimeout(timeout);
            sw.removeEventListener('controllerchange', onController);
            if (installing && onState) installing.removeEventListener('statechange', onState);
        }
    }
    
    // 检测WebGL支持
    function isWebGLSupported() {
        try {
            const canvas = document.createElement('canvas');
            return !!(window.WebGLRenderingContext && 
                (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
        } catch(e) {
            return false;
        }
    }
    
    // 初始化应用
    async function loadAppScripts() {
        try {
            await prepareServiceWorker();
            markStartup('cache-ready');

            if (!isWebGLSupported()) {
                throw new Error('WebGL is not supported');
            }

            // 判断启动引擎：若用户上次用的是 KM，首帧就需要 KM
            const savedEngine = localStorage.getItem('mixbox_engine') || 'km';
            const coreScripts = [
                'js/params.js', 'js/device-profile.js', 'js/frame-scheduler.js',
                'js/base-painter.js', 'js/brush-manager.js', 'js/palette-storage.js',
                'js/ps-bridge.js', 'js/palette-presets.js', 'js/zoom.js', 'js/onboarding.js',
            ];
            const painterExtensions = ['js/heatmap.js', 'js/wetpaper.js', 'js/drip.js'];
            const engineScripts = savedEngine === 'mixbox'
                ? ['js/mixbox.js', 'js/mixbox-painter.js'] : ['js/km-painter.js'];
            ['js/i18n-translations.js', 'js/i18n.js', ...coreScripts, ...painterExtensions,
                ...engineScripts, 'js/app.js'].forEach(src => preloadResource(src, 'script'));
            if (savedEngine !== 'mixbox') preloadResource('assets/km-lut.png', 'fetch');

            // 前置：i18n 必须在所有其他脚本之前就绪，否则后续脚本顶层代码读取 I18N 会拿到未初始化状态
            await Promise.all([
                loadScript('js/i18n-translations.js'),
                loadScript('js/i18n.js'),
            ]);
            I18N.init();
            markStartup('i18n-ready');
            console.log('✅ i18n 就绪:', I18N.getLang());

            // Tier 0：无依赖的脚本全部并行下载
            const tier0 = Promise.all(coreScripts.map(loadScript));
            // 后面的层可能先失败，先挂 catch 避免未处理拒绝；最终仍由 await 抛出。
            tier0.catch(() => {});

            // Tier 1：依赖 base-painter.js（class 定义 / prototype 挂载）
            await loadScript('js/base-painter.js'); // dedupe 命中，仅等 tier0 中的同一份
            const tier1 = Promise.all(painterExtensions.map(loadScript));
            tier1.catch(() => {});

            // 轻量版本信息不阻塞核心；公告代码在可交互后加载。
            const updaterPromise = loadScript('js/updater.js').catch(error => {
                console.warn('版本信息加载失败:', error);
            });

            // 只执行启动引擎。另一引擎保留 ensure*Loaded 按需入口，完整 SW 快照仍包含它。
            let bootEnginePromise = null;
            if (savedEngine === 'mixbox') {
                bootEnginePromise = window.ensureMBLoaded();
            } else {
                bootEnginePromise = window.ensureKMLoaded();
            }
            bootEnginePromise.catch(() => {});

            await tier0;
            await tier1;
            console.log('✅ 核心依赖已加载');

            await bootEnginePromise;
            console.log(`✅ ${savedEngine === 'mixbox' ? 'Mixbox' : 'KM'} 引擎已加载（启动引擎）`);

            // app.js 依赖以上全部
            await loadScript('js/app.js');
            markStartup('scripts-ready');
            console.log('✅ app.js 已加载');

            // 重要：手动调用 app.js 中的 initApp 函数
            console.log('🚀 正在初始化应用...');
            markStartup('init-start');
            const result = await window.initApp();
            clearTimeout(loadingWatchdog);
            if (result?.ready === false && result.reason === 'incompatible-host') return;
            if (result?.ready !== true) throw new Error('initApp did not report core readiness');
            if (result?.cursorPreview && result.cursorPreview.status !== 'ready') {
                console.warn('光标预热降级:', result.cursorPreview.status);
            }
            markStartup('interactive');

            // 揭示主界面，淡出 loading 覆盖层
            document.body.classList.add('app-ready');
            const loader = document.getElementById('appLoader');
            if (loader) {
                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 300);
            }

            // 辅助模块加载完后再挂版本号 / 公告
            Promise.all([updaterPromise, loadScript('js/announcer.js')]).then(() => {
                const versionLabel = document.getElementById('versionLabel');
                if (versionLabel && typeof Updater !== 'undefined') {
                    versionLabel.textContent = Updater.CURRENT_VERSION;
                    versionLabel.title = I18N.t('clickCheckUpdate');
                    versionLabel.addEventListener('click', () => Announcer.checkUpdate());
                }
                // 延迟启动公告组件（包揽更新检测 + 公告推送）
                // 用 requestIdleCallback 让公告初始化在浏览器空闲时执行，
                // 避免抢占首屏资源；不支持的环境兜底到 setTimeout。
                const startAnnouncer = () => Announcer.init();
                if (typeof requestIdleCallback === 'function') {
                    requestIdleCallback(startAnnouncer, { timeout: 3000 });
                } else {
                    setTimeout(startAnnouncer, 3000);
                }
            }).catch(error => console.warn('公告加载失败:', error));

        } catch (error) {
            console.error('初始化失败:', error);
            clearTimeout(loadingWatchdog);
            markStartup('failed');
            showLoadProblem(true);
        }
    }
    
    // 页面加载完成后加载脚本
    window.addEventListener('DOMContentLoaded', loadAppScripts);

</script>
</body>
</html>
